name: daily-floorsheet
on:
  schedule:
    - cron: "30 10 * * 0-5"   # 16:15 Nepal time, Sun-Fri (after market close)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-floorsheet
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi
      - run: python scripts/fetch_floorsheet.py
      - name: Fetch today's prices
        run: python scripts/fetch_prices.py
        continue-on-error: true
      - name: Fetch companies, full day prices and indices
        run: python scripts/fetch_market.py
        continue-on-error: true
      - run: |
          git config user.name "floorsheet-bot"
          git config user.email "floorsheet-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "floorsheet $(date -u +%F)"
          git push

  dashboard:
    # Builds the dashboard data and publishes docs/ to GitHub Pages.
    # One-time setup: repo Settings -> Pages -> Source: "GitHub Actions";
    # Settings -> Secrets and variables -> Actions -> New repository secret DASH_PASSWORD (dashboard password).
    # Without the secret no readable data is published.
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Get price history (Aabishkar2/nepse-data)
        run: GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/Aabishkar2/nepse-data.git ../nepse-data
      - name: Build dashboard data
        run: |
          mkdir -p docs/data
          REPORT_OUT=docs/data/latest.json node scripts/scan_daily.js ../nepse-data/data/company-wise data
          node scripts/backtest_components.js ../nepse-data/data/company-wise docs/data/backtest.json
      - name: Encrypt dashboard data (password in repo secret DASH_PASSWORD)
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: node scripts/encrypt_data.js docs/data/latest.json docs/data/backtest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
