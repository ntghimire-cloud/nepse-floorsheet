name: daily-floorsheet
on:
  schedule:
    - cron: "30 10 * * 0-5"   # 16:15 Nepal time, Sun-Fri (after market close)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install git+https://github.com/basic-bgnr/NepseUnofficialApi
      - run: python scripts/fetch_floorsheet.py
      - run: |
          git config user.name "floorsheet-bot"
          git config user.email "floorsheet-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "floorsheet $(date -u +%F)"
          git push
